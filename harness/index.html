<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Postsmith host harness</title>
    <style>
      body { font: 14px/1.5 system-ui, sans-serif; margin: 0; background: #f4f4f5; color: #18181b; }
      main { max-width: 640px; margin: 0 auto; padding: 24px 16px; }
      .bubble { background: #fff; border-radius: 14px; padding: 12px 14px; margin: 12px 0; border: 1px solid #e4e4e7; }
      .me { background: #e8f0fe; margin-left: 15%; }
      iframe { width: 100%; border: 0; display: block; min-height: 120px; }
      #log { font: 12px ui-monospace, monospace; white-space: pre-wrap; color: #52525b; }
    </style>
  </head>
  <body>
    <main>
      <p><strong>Local host harness</strong> — renders the Postsmith widget the way ChatGPT/Claude do (sandboxed iframe + MCP Apps bridge).</p>
      <div class="bubble me">Make a LinkedIn post: we launched same-day delivery in Lahore.</div>
      <div class="bubble">Here's your post:<iframe id="app" sandbox="allow-scripts allow-same-origin"></iframe></div>
      <div id="log"></div>
    </main>
    <script type="module" src="./harness.ts"></script>
  </body>
</html>
